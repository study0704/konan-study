<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b70"><title>興南中 受験トレーニング</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#172c46;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:18px}header{background:#173b70;color:white;padding:20px;border-radius:0 0 22px 22px}header h1{margin:0;font-size:23px}header p{margin:6px 0 0;color:#dce9ff;font-size:13px}.card{background:white;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 4px 18px #183c6710}.row{display:flex;gap:10px;flex-wrap:wrap}.chip,button{font:inherit;border:0;cursor:pointer}.chip{border-radius:100px;padding:10px 15px;background:#e9eef7;color:#23466f}.chip.active{background:#173b70;color:white}button.primary{background:#1768c1;color:white;padding:13px 18px;border-radius:12px;font-weight:700}button.secondary{background:#eaf1fb;color:#174d85;padding:12px 15px;border-radius:12px}button:disabled{opacity:.45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#eaf2ff;border-radius:13px;padding:12px;text-align:center}.stat strong{font-size:22px;display:block}.stat span{font-size:12px}.muted{color:#687b90;font-size:13px}.question{font-size:19px;font-weight:700;line-height:1.7;white-space:pre-line}.answers{display:grid;gap:10px;margin:18px 0}.answer{padding:14px;border:2px solid #e0e7f0;background:white;text-align:left;border-radius:12px;color:#172c46}.answer.selected{border-color:#1768c1;background:#eaf3ff}.answer.correct{border-color:#15956a;background:#e6f7ee}.answer.wrong{border-color:#d85151;background:#fff0f0}.explain{background:#f3f7fc;border-left:4px solid #1768c1;border-radius:8px;padding:14px;line-height:1.8;white-space:pre-line}.tag{font-size:12px;color:#3466a1;font-weight:700}.hidden{display:none}.bar{height:9px;background:#e8edf5;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:#2b81d5;transition:width .2s}footer{text-align:center;font-size:12px;color:#8190a1;padding:24px}input[type=number]{width:100%;font:inherit;padding:13px;border:2px solid #dbe4ef;border-radius:10px}h2{margin:0 0 14px;font-size:20px}</style></head><body><header><div class="wrap" style="padding:0"><h1>📘 興南中 受験トレーニング</h1><p>4教科対応・弱点復習・自動採点 ｜ オリジナル練習問題</p></div></header><main class="wrap"><section class="card"><div class="stats"><div class="stat"><strong id="attempts">0</strong><span>回答数</span></div><div class="stat"><strong id="accuracy">—</strong><span>正答率</span></div><div class="stat"><strong id="misses">0</strong><span>復習待ち</span></div></div></section><section id="setup" class="card"><h2>今日の問題を選ぶ</h2><p class="muted">教科を選んでスタート。間違えた問題はこの端末に保存されます。</p><div class="row" id="subjects"></div><p class="muted" style="margin-top:20px">出題モード</p><div class="row" id="modes"><button class="chip active" data-mode="all">通常演習</button><button class="chip" data-mode="wrong">間違い直し</button></div><p id="available" class="muted"></p><button class="primary" id="start">演習スタート →</button></section><section id="quiz" class="card hidden"><div class="row" style="justify-content:space-between"><span class="tag" id="topic"></span><span class="muted" id="counter"></span></div><div class="bar" style="margin:12px 0 22px"><div id="progress"></div></div><div class="question" id="prompt"></div><div class="answers" id="answers"></div><div id="feedback" class="hidden"><p id="result" style="font-weight:700"></p><div class="explain" id="explanation"></div></div><div class="row" style="margin-top:18px"><button class="primary" id="check" disabled>答え合わせ</button><button class="primary hidden" id="next">次の問題 →</button><button class="secondary" id="quit">終了</button></div></section><section id="finish" class="card hidden"><h2>🎉 演習終了！</h2><p id="summary"></p><div class="row"><button class="primary" id="retry">もう一度練習する</button><button class="secondary" id="home">教科選択に戻る</button></div></section><footer>試作品 v1.0｜学習記録はこのブラウザ内に保存されます。公式問題・公式出題傾向を保証するものではありません。</footer></main><script>
const Q=[
['算数','仕事算','Aさんは1人で12日、Bさんは1人で6日かかる仕事があります。2人で一緒にすると何日で終わりますか。',['3日','4日','6日','9日'],1,'1日で進む仕事は Aが1/12、Bが1/6。合わせて1/12＋2/12＝3/12＝1/4。よって4日です。'],
['算数','仕事算','ある仕事をAさんは1人で10日、Bさんは1人で15日で終えます。2人で3日働くと、仕事全体の何分のいくつが終わりますか。',['1/3','1/2','2/3','5/6'],1,'1日分は1/10＋1/15＝1/6。3日で3/6＝1/2です。'],
['算数','旅人算','AさんとBさんが同じ地点から反対方向に歩きます。Aさんは分速60m、Bさんは分速80mです。2人の間が700mになるのは何分後ですか。',['4分','5分','7分','10分'],1,'反対方向なので離れる速さは60＋80＝140m/分。700÷140＝5分。'],
['算数','追いかけ算','兄が分速80mで出発し、その5分後に弟が同じ道を分速100mで追いかけます。弟が兄に追いつくのは、弟の出発から何分後ですか。',['15分','20分','25分','40分'],1,'兄の先行距離は80×5＝400m。差の速さは100－80＝20m/分。400÷20＝20分。'],
['算数','食塩水','5%の食塩水300gに20%の食塩水を何g混ぜると、8%になりますか。',['60g','75g','100g','120g'],1,'加える量をx gとすると、食塩は15＋0.2x g。15＋0.2x＝0.08(300＋x)。0.12x＝9、x＝75g。'],
['算数','食塩水','6%の食塩水300gに18%の食塩水を何g混ぜると、10%になりますか。',['100g','120g','150g','200g'],2,'てんびん算で(10－6):(18－10)＝4:8＝1:2。6%の300gに対して18%は半分の150g。'],
['算数','過不足算','鉛筆を1人に4本ずつ配ると6本余り、5本ずつ配ると3本足りません。人数は何人ですか。',['7人','8人','9人','10人'],2,'4本ずつから5本ずつにすると1人あたり1本増える。余り6本と不足3本の合計9本が必要なので9人。'],
['算数','規則性','1、4、9、16、25、…と並ぶ数列の8番目の数はいくつですか。',['49','56','64','81'],2,'1²、2²、3²、4²、5²…という平方数。8番目は8×8＝64。'],
['算数','図形','底辺12cm、高さ7cmの三角形の面積は何cm²ですか。',['19','42','84','96'],1,'三角形の面積＝底辺×高さ÷2。12×7÷2＝42cm²。'],
['算数','割合','定価1200円の商品を25%引きで買いました。代金はいくらですか。',['300円','900円','975円','1100円'],1,'支払うのは100－25＝75%。1200×0.75＝900円。'],
['国語','漢字の読み','「慎重」の読みとして正しいものはどれですか。',['しんじゅう','しんちょう','じんちょう','しんじょう'],1,'「慎重」は「しんちょう」。軽々しく行動せず、よく考えることです。'],
['国語','漢字の書き','「努力をケイゾクする」の「ケイゾク」に当たる漢字はどれですか。',['継続','継族','経続','計続'],0,'正しくは「継続」。続けることを表します。'],
['国語','語句','「石橋をたたいて渡る」の意味として最も適切なものはどれですか。',['急いで決める','用心深く行動する','人に任せる','何もしない'],1,'安全そうな石橋でも確かめてから渡ることから、非常に慎重に行動する意味です。'],
['国語','読解','「雨がやんだので、太郎は傘を閉じて歩き始めた。」太郎が傘を閉じた理由は何ですか。',['風が強かったから','傘が壊れたから','雨がやんだから','家に着いたから'],2,'「雨がやんだので」が理由を表しています。'],
['理科','植物','植物が光合成で主に取り入れる気体はどれですか。',['酸素','二酸化炭素','窒素','水素'],1,'光合成では光のエネルギーを利用し、二酸化炭素と水から養分を作り、酸素を放出します。'],
['理科','電気','同じ乾電池と豆電球を使うとき、乾電池2個を直列につないだ場合の特徴はどれですか。',['電圧が大きくなる','電圧が必ず0になる','電流が流れなくなる','電池が1個になる'],0,'同じ向きに直列につなぐと電圧が加わり、通常は豆電球が明るくなります。'],
['理科','天体','月が地球のまわりを回ることによって見かけの形が変わる現象は何ですか。',['日食','月食','月の満ち欠け','地震'],2,'太陽に照らされた月の部分のうち、地球から見える割合が変わるためです。'],
['理科','水溶液','食塩を水に溶かした後、水だけを蒸発させると主に何が残りますか。',['砂糖','食塩','酸素','何も残らない'],1,'食塩は水に溶けていますが蒸発しないため、残ります。'],
['社会','地理','沖縄県の県庁所在地はどこですか。',['沖縄市','名護市','那覇市','浦添市'],2,'沖縄県の県庁所在地は那覇市です。'],
['社会','歴史','江戸幕府を開いた人物は誰ですか。',['織田信長','豊臣秀吉','徳川家康','徳川吉宗'],2,'徳川家康は1603年に征夷大将軍となり、江戸幕府を開きました。'],
['社会','公民','日本国憲法で定められている国民の三大義務に含まれないものはどれですか。',['納税','勤労','子どもに普通教育を受けさせること','選挙で投票すること'],3,'三大義務は納税・勤労・子どもに普通教育を受けさせること。投票は権利です。'],
['社会','地理','日本で最も面積が大きい都道府県はどこですか。',['北海道','岩手県','長野県','沖縄県'],0,'北海道が日本で最も面積の大きい都道府県です。']
].map((a,i)=>({id:i,subject:a[0],topic:a[1],question:a[2],options:a[3],correct:a[4],explain:a[5]}));
const KEY='konan_exam_v1';let history={};try{history=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let subject='算数',mode='all',pool=[],index=0,selected=null,checked=false,correctCount=0;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){}}function stats(){const a=Object.values(history),attempts=a.reduce((s,x)=>s+x.attempts,0),right=a.reduce((s,x)=>s+x.correct,0);$('attempts').textContent=attempts;$('accuracy').textContent=attempts?Math.round(right/attempts*100)+'%':'—';$('misses').textContent=a.filter(x=>x.wrong).length;}function available(){const n=Q.filter(q=>q.subject===subject&&(mode==='all'||history[q.id]?.wrong)).length;$('available').textContent=mode==='wrong'?`復習できる問題：${n}問`:`収録問題：${n}問`; $('start').disabled=n===0;}function subjects(){['算数','国語','理科','社会'].forEach(s=>{const b=document.createElement('button');b.className='chip'+(s===subject?' active':'');b.textContent=s;b.onclick=()=>{subject=s;subjectsRefresh();available()};$('subjects').appendChild(b)})}function subjectsRefresh(){[...$('subjects').children].forEach(b=>b.classList.toggle('active',b.textContent===subject))}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));available()});function show(id){['setup','quiz','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function start(){pool=Q.filter(q=>q.subject===subject&&(mode==='all'||history[q.id]?.wrong));index=0;correctCount=0;show('quiz');render()}function render(){const q=pool[index];selected=null;checked=false;$('topic').textContent=q.subject+' ｜ '+q.topic;$('counter').textContent=`${index+1} / ${pool.length}問`;$('progress').style.width=(index/pool.length*100)+'%';$('prompt').textContent=q.question;$('answers').innerHTML='';q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=`${'ABCD'[i]}. ${opt}`;b.onclick=()=>{if(checked)return;selected=i;[...$('answers').children].forEach((x,j)=>x.classList.toggle('selected',j===i));$('check').disabled=false};$('answers').appendChild(b)});$('feedback').classList.add('hidden');$('check').classList.remove('hidden');$('check').disabled=true;$('next').classList.add('hidden');$('next').textContent=index===pool.length-1?'結果を見る →':'次の問題 →'}function check(){if(selected===null||checked)return;checked=true;const q=pool[index],ok=selected===q.correct;correctCount+=ok?1:0;const h=history[q.id]||{attempts:0,correct:0,wrong:false};h.attempts++;if(ok)h.correct++;h.wrong=!ok;history[q.id]=h;save();stats();[...$('answers').children].forEach((b,i)=>{if(i===q.correct)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});$('result').textContent=ok?'✅ 正解！':'❌ 不正解｜正解は '+('ABCD'[q.correct]);$('result').style.color=ok?'#13875c':'#c24343';$('explanation').textContent=q.explain;$('feedback').classList.remove('hidden');$('check').classList.add('hidden');$('next').classList.remove('hidden')}function next(){index++;if(index>=pool.length){$('summary').textContent=`${pool.length}問中 ${correctCount}問正解（正答率 ${Math.round(correctCount/pool.length*100)}%）。間違えた問題は「間違い直し」から再挑戦できます。` ;show('finish')}else render()}$('start').onclick=start;$('check').onclick=check;$('next').onclick=next;$('quit').onclick=()=>{stats();show('setup');available()};$('retry').onclick=start;$('home').onclick=()=>{show('setup');available()};subjects();stats();available();</script></body></html>
