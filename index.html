","参勤交代"],"a":0,"e":"冠位十二階は603年に定められた制度です。"},{"s":"社会","t":"地理","d":"標準","q":"沖縄県の県庁所在地は？","o":["浦添市","那覇市","沖縄市","名護市"],"a":1,"e":"県庁所在地は那覇市です。"},{"s":"社会","t":"公民","d":"入試","q":"法律を制定する国の機関は？","o":["国会","内閣","都道府県庁","最高裁判所"],"a":0,"e":"国会は国の唯一の立法機関です。"},{"s":"社会","t":"歴史","d":"入試","q":"明治時代の「廃藩置県」は何を廃止した？","o":["藩","国会","県","裁判所"],"a":0,"e":"藩を廃止して府県を置きました。"},{"s":"社会","t":"地理","d":"入試","q":"日本の太平洋側で冬に晴天が多い主な理由は？","o":["日照時間が必ず24時間になるため","冬に台風が多いため","海流が止まるため","季節風が山地を越えて乾燥するため"],"a":3,"e":"日本海側で雪や雨を降らせた季節風は山を越えると乾燥します。"},{"s":"社会","t":"歴史","d":"入試","q":"第二次世界大戦が終わった年は？","o":["1964年","1950年","1939年","1945年"],"a":3,"e":"日本は1945年に終戦を迎えました。"}];
const KEY='konan-v2-history';
const SUBJECTS=['算数','国語','理科','社会'];
const getHistory=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}};
let history=getHistory(),view='home',queue=[],pos=0,selected=null,answered=false,exam=false,deadline=0,ticker=null,results=[],filter={s:'算数',t:'すべて',d:'すべて'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){}}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function rate(a){return a.length?Math.round(a.filter(x=>x.ok).length/a.length*100):0}
function summary(){const h=Object.values(history),attempts=h.reduce((n,x)=>n+x.length,0),correct=h.reduce((n,x)=>n+x.filter(y=>y.ok).length,0);return `<div class="stats"><div class="stat"><strong>${attempts}</strong><small>累計解答</small></div><div class="stat"><strong>${correct}</strong><small>正解</small></div><div class="stat"><strong>${attempts?Math.round(correct/attempts*100):0}%</strong><small>累計正答率</small></div></div>`}
function home(){stopTimer();view='home';let topics=[...new Set(QUESTIONS.filter(q=>q.s===filter.s).map(q=>q.t))];if(filter.t!=='すべて'&&!topics.includes(filter.t))filter.t='すべて';let weak=QUESTIONS.filter(q=>history[q.id]?.length&&history[q.id].at(-1).ok===false).length;
 $('app').innerHTML=`<section class="panel"><h2>学習ダッシュボード</h2>${summary()}<p class="muted">問題100問（算数60・国語15・理科13・社会12）</p></section><section class="panel"><h2>単元別トレーニング</h2><div class="filters"><div><label for="subject">教科</label><select id="subject">${SUBJECTS.map(s=>`<option ${s===filter.s?'selected':''}>${s}</option>`).join('')}</select></div><div><label for="topic">単元</label><select id="topic"><option>すべて</option>${topics.map(t=>`<option ${t===filter.t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div><label for="difficulty">難易度</label><select id="difficulty">${['すべて','基礎','標準','入試'].map(d=>`<option ${d===filter.d?'selected':''}>${d}</option>`).join('')}</select></div></div><p id="count" class="muted"></p><button id="practice" style="width:100%">選んだ問題を演習する</button></section><section class="panel"><h2>⏱ 30分模擬試験</h2><p class="muted">4教科から20問を出題（算数12・国語3・理科3・社会2）。解答後にまとめて採点。制限時間30分。</p><button id="mock" style="width:100%">模擬試験を始める</button></section><section class="panel"><h2>🔁 間違い直し</h2><p class="muted">直近の回答が不正解だった問題：<strong>${weak}問</strong></p><button class="secondary" id="retry" style="width:100%" ${weak?'':'disabled'}>苦手問題を復習する</button></section><section class="panel"><h2>📊 単元別の弱点分析</h2><div id="analytics"></div><button id="clear" class="outline">学習履歴を消去</button></section>`;
 $('subject').onchange=e=>{filter.s=e.target.value;filter.t='すべて';home()};$('topic').onchange=e=>{filter.t=e.target.value;updateCount()};$('difficulty').onchange=e=>{filter.d=e.target.value;updateCount()};$('practice').onclick=()=>start(QUESTIONS.filter(q=>q.s===filter.s&&(filter.t==='すべて'||q.t===filter.t)&&(filter.d==='すべて'||q.d===filter.d)).map(q=>q.id),false);$('mock').onclick=()=>{let ids=[];for(let [s,n] of [['算数',12],['国語',3],['理科',3],['社会',2]])ids.push(...shuffle(QUESTIONS.filter(q=>q.s===s)).slice(0,n).map(q=>q.id));start(shuffle(ids),true)};$('retry').onclick=()=>start(QUESTIONS.filter(q=>history[q.id]?.length&&history[q.id].at(-1).ok===false).map(q=>q.id),false);$('clear').onclick=()=>{if(confirm('このiPhone内の学習履歴をすべて削除しますか？')){history={};save();home()}};updateCount();analytics()}
function updateCount(){let n=QUESTIONS.filter(q=>q.s===filter.s&&(filter.t==='すべて'||q.t===filter.t)&&(filter.d==='すべて'||q.d===filter.d)).length;$('count').textContent=`該当する問題：${n}問`;$('practice').disabled=!n}
function analytics(){let groups={};QUESTIONS.forEach(q=>{let key=q.s+' / '+q.t;groups[key]??=[];groups[key].push(...(history[q.id]||[]))});let sorted=Object.entries(groups).filter(([k,v])=>v.length).sort((a,b)=>rate(a[1])-rate(b[1]));$('analytics').innerHTML=sorted.length?sorted.map(([k,v])=>`<div class="bar"><span style="width:135px">${esc(k)}<small> (${v.length}回)</small></span><div class="track"><div class="fill" style="width:${rate(v)}%"></div></div><b>${rate(v)}%</b></div>`).join(''):'<p class="muted">まだ学習履歴がありません。問題を解くと表示されます。</p>'}
function start(ids,isExam){if(!ids.length)return;queue=ids;pos=0;selected=null;answered=false;exam=isExam;results=[];deadline=isExam?Date.now()+30*60*1000:0;view='quiz';renderQuiz();if(isExam){ticker=setInterval(()=>{if(view!=='quiz'){stopTimer();return}let left=deadline-Date.now();if(left<=0){finish();return}let el=$('clock');if(el){el.textContent=clock(left);el.classList.toggle('low',left<60000)}},500)}}
function stopTimer(){if(ticker){clearInterval(ticker);ticker=null}}
function clock(ms){let t=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function renderQuiz(){if(exam&&Date.now()>=deadline){finish();return}let q=QUESTIONS[queue[pos]];let opts=q.o.map((o,i)=>`<button class="choice ${selected===i?'selected':''} ${!exam&&answered&&i===q.a?'correct':''} ${!exam&&answered&&selected===i&&i!==q.a?'wrong':''}" data-i="${i}" ${answered?'disabled':''}>${'アイウエ'[i]}　${esc(o)}</button>`).join('');$('app').innerHTML=`<section class="panel"><div class="row"><span class="pill">${esc(q.s)} / ${esc(q.t)} / ${esc(q.d)}</span>${exam?`<span class="timer" id="clock">${clock(deadline-Date.now())}</span>`:''}</div><div class="row"><strong>第${pos+1}問 / ${queue.length}問</strong><button class="secondary" id="back" style="padding:7px 10px;min-height:36px">終了</button></div><div class="progress"><div style="width:${100*(pos+1)/queue.length}%"></div></div><div class="question">${esc(q.q)}</div><div id="choices">${opts}</div><div id="feedback"></div><div class="buttons"><button id="next" ${exam?'':'disabled'}>${pos+1===queue.length?'結果を見る':'次の問題へ'}</button></div>${exam?'<p class="warning">模試は解答後に採点します。選択せずに次へ進むと無回答扱いになります。</p>':''}</section>`;
 document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(Number(b.dataset.i)));$('next').onclick=next;$('back').onclick=()=>{if(confirm('演習を終了してトップに戻りますか？（今回の未完了の模試は記録されません）'))home()}}
function pick(i){if(answered)return;selected=i;answered=true;let q=QUESTIONS[queue[pos]];if(!exam){record(q.id,i===q.a);renderQuiz();$('feedback').innerHTML=`<div class="explain"><strong>${i===q.a?'✅ 正解！':'❌ 不正解'}</strong><p>正解：${'アイウエ'[q.a]}　${esc(q.o[q.a])}</p><strong>解説</strong><p>${esc(q.e)}</p></div>`;$('next').disabled=false}else{results.push({id:q.id,choice:i});renderQuiz()}}
function next(){if(exam){if(!answered)results.push({id:queue[pos],choice:null})}if(pos+1<queue.length){pos++;selected=null;answered=false;renderQuiz()}else finish()}
function record(id,ok){history[id]??=[];history[id].push({ok,ts:Date.now()});save()}
function finish(){stopTimer();view='result';if(exam){for(let r of results){let q=QUESTIONS[r.id];record(r.id,r.choice===q.a)}let seen=new Set(results.map(r=>r.id));for(let id of queue){if(!seen.has(id))record(id,false)}}let score=exam?results.filter(r=>r.choice===QUESTIONS[r.id].a).length:queue.filter(id=>history[id]?.at(-1)?.ok).length;let details=exam?queue.map((id,i)=>{let q=QUESTIONS[id],r=results.find(r=>r.id===id),ok=r?.choice===q.a;return `<details style="margin:10px 0"><summary>${ok?'✅':'❌'} 第${i+1}問 ${esc(q.s)}・${esc(q.t)}</summary><p>${esc(q.q)}</p><p>正解：${esc(q.o[q.a])}</p><p>${esc(q.e)}</p></details>`}).join(''):'';
 $('app').innerHTML=`<section class="panel"><h2>🎉 演習結果</h2><div class="stat"><strong>${score} / ${queue.length}</strong><small>正解数（${Math.round(score/queue.length*100)}%）</small></div><p class="muted">${exam?'模試の解答・解説を確認できます。':'解説を復習して、次は間違い直しに挑戦しましょう。'}</p>${details}<button id="home" style="width:100%">トップに戻る</button></section>`;$('home').onclick=home}
QUESTIONS.forEach((q,i)=>q.id=i);
try{home()}catch(e){$('error').textContent='表示エラー: '+e.message}
</script></body></html>
